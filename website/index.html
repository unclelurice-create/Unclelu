<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uncle Lu Rice Bowl</title>
<style>
:root{--bg:#ffffff;--card:#fff;--ink:#2a1a14;--mut:#7a6a60;--red:#c62828;--red2:#a51f1f;--line:#eadfca;--ok:#2e7d32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 110px}
header{padding:28px 0 12px;text-align:center}
.logo{display:inline-block;background:var(--red);color:#fff;font-weight:800;letter-spacing:1px;padding:8px 18px;border-radius:12px;font-size:22px}
header p{margin:8px 0 0;color:var(--mut);font-size:14px}
.badge{display:inline-block;margin-top:10px;background:var(--card);border:1px dashed var(--red);color:var(--red);padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600}
h2{font-size:17px;margin:22px 0 10px}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;align-items:center}
.emo img{width:100%;height:100%;object-fit:cover;border-radius:14px}.hero{width:100%;height:190px;object-fit:cover;border-radius:14px;margin-bottom:12px}.emo{overflow:hidden;width:72px;height:72px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:32px;flex:none}
.info{flex:1;min-width:0}
.info b{display:block;font-size:15px}
.info small{color:var(--mut);font-size:12px}
.price{font-weight:700;margin-top:4px;font-size:14px}
button{font:inherit;cursor:pointer}
.add{background:var(--red);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600}
.add:active{background:var(--red2)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);display:none}
.bar button{display:flex;justify-content:space-between;width:100%;max-width:560px;margin:0 auto;background:var(--red);color:#fff;border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:15px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.on{display:flex}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;font-size:14px}
.opt input{width:20px;height:20px;accent-color:var(--red)}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px}
.qty span{min-width:20px;text-align:center;font-weight:700}
.cta{width:100%;background:var(--red);color:#fff;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:15px;margin-top:12px}
.cta.wa{background:#25d366;color:#0b2e17}
.ghost{background:none;border:0;color:var(--mut);width:100%;padding:12px;margin-top:4px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=tel],textarea,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.seg button.on{border-color:var(--red);background:var(--red);color:#fff}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.sum .row{font-size:14px;padding:3px 0}
.tot{border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;font-weight:800;font-size:16px}
.steps{display:flex;gap:6px;margin:4px 0 8px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--red)}
.err{color:var(--red);font-size:12px;margin-top:4px;display:none}
.mut{color:var(--mut);font-size:13px}
.nav{position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.nav-t{font-size:22px;font-weight:800;color:var(--red);letter-spacing:.3px}
.nav-c{display:flex;align-items:center;gap:8px;background:var(--red);color:#fff;border:0;border-radius:99px;padding:9px 16px;font-weight:600;font-size:14px}
.nav-c b{background:#fff;color:var(--red);border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;padding:0 6px}
header{padding-top:12px}.brand{display:block;width:260px;max-width:78%;height:auto;margin:0 auto;object-fit:contain}
.qris{display:block;width:100%;border-radius:12px;border:1px solid var(--line);margin:8px 0}.cta:disabled{opacity:.4;cursor:not-allowed}
#side{display:none}
@media (min-width:900px){
.layout{display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:start}
#side{display:block;position:sticky;top:20px;margin-top:32px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;max-height:calc(100vh - 40px);overflow:auto}
#side h3{margin:0 0 10px;font-size:18px}
#side .sum{background:var(--bg);margin:8px 0}

.wrap{max-width:1120px;padding:0 40px 120px}
header{padding:56px 0 24px}
.nav{padding:14px 40px}
.brand{width:300px}
header p{font-size:17px}
h2{font-size:22px;margin:32px 0 16px}
#menu{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.item{flex-direction:column;align-items:stretch;padding:14px;margin:0;gap:14px;transition:transform .15s,box-shadow .15s}
.item:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.12)}
.emo{width:100%;height:230px;font-size:72px;border-radius:12px}
.emo img{border-radius:12px}
.info b{font-size:18px}
.info small{font-size:13px}
.price{font-size:17px;margin-top:8px}
.add{width:100%;padding:12px}
.bar{display:none!important}
.sheet{align-items:center;padding:24px}
.panel{max-width:480px;border-radius:20px;max-height:90vh;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.hero{height:240px}
}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-height:46px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:#111;color-scheme:light;font:inherit;text-align:left}
input[type=date]::-webkit-calendar-picker-indicator{filter:none;opacity:.8}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:22px;height:22px;flex:none;margin:0;border:2px solid #b9a99a;border-radius:6px;background:#fff;position:relative;color-scheme:light}
input[type=checkbox]:checked{background:var(--red);border-color:var(--red)}
input[type=checkbox]:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
input[type=radio]{-webkit-appearance:none;appearance:none;width:22px;height:22px;flex:none;margin:0;border:2px solid #b9a99a;border-radius:50%;background:#fff;position:relative;color-scheme:light}
input[type=radio]:checked{border-color:var(--red)}
input[type=radio]:checked::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--red)}
.wk-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.wk-nav{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:20px;line-height:1}
.wk-nav:disabled{opacity:.35}
.wk-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk-d{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.wk-d small{font-size:11px;color:var(--mut)}
.wk-d b{font-size:17px}
.wk-d em{font-style:normal;font-size:10px;color:var(--ok);min-height:12px}
.wk-d.on{background:var(--red);border-color:var(--red);color:#fff}
.wk-d.on small,.wk-d.on em{color:#fff}
.wk-d.off{background:#f3f0ea;color:#aaa;cursor:not-allowed}
.wk-d.off small{color:#bbb}
.wk-d.cl em{color:var(--red);font-weight:700}
.wk-d.cl b{text-decoration:line-through}
</style>
</head>

const rp = n => "Rp" + n.toLocaleString("id-ID");
const todayStr = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtDate = s => new Date(s+"T00:00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
let cart = [], draft = null, form = {name:"",phone:"",date:"",mode:"Pickup",addr:"",note:""};
let deliv = {ok:false,fee:0,km:0,loading:false,msg:"",coords:null,src:"",terbaca:""};
const $ = id => document.getElementById(id);

$("menu").innerHTML = PRODUCTS.map(p => `
  <div class="item"><div class="emo">${IMG[p.id]?`<img src="${IMG[p.id]}" alt="${p.name}">`:p.emo}</div>
  <div class="info"><b>${p.name}</b><small>${p.desc}</small><div class="price">${rp(p.price)}</div></div>
  <button class="add" onclick="pick('${p.id}')">Pesan</button></div>`).join("");

function show(html){ $("panel").innerHTML = html; $("sheet").classList.add("on"); }
function hide(){ $("sheet").classList.remove("on"); }
$("sheet").addEventListener("click", e => { if(e.target.id==="sheet") hide(); });

function pick(id){
  if(!form.date){ show(`<div style="text-align:center;padding:16px 0"><div style="font-size:44px">📅</div><b style="font-size:18px">Pilih tanggal dulu</b><p class="mut">Pilih tanggal pesanan di atas menu, lalu pilih menunya.</p><button class="cta" onclick="hide();document.getElementById('week').scrollIntoView({behavior:'smooth',block:'center'})">Pilih tanggal</button></div>`); return; }
  draft = {pid:id, qty:1, adds:[], sauce:"", note:""};
  drawPick();
}
function lineTotal(l){
  const p = PRODUCTS.find(x=>x.id===l.pid);
  const a = l.adds.reduce((s,i)=>s+ADDONS.find(x=>x.id===i).price,0);
  return (p.price + a) * l.qty;
}
function drawPick(){
  const p = PRODUCTS.find(x=>x.id===draft.pid);
  show(`${IMG[p.id]?`<img class="hero" src="${IMG[p.id]}" alt="${p.name}">`:""}<div class="row"><b style="font-size:18px">${p.name}</b><span class="price">${rp(p.price)}</span></div>
  <p class="mut">${p.desc}</p>
  ${p.sauces?`<h2 style="margin-top:12px">Pilih Sauce</h2>`+p.sauces.map((s,i)=>`<label class="opt" style="font-weight:400"><span>${s}</span><input type="radio" name="sc" ${draft.sauce===s?"checked":""} onchange="setSauce(${i})"></label>`).join(""):""}
  <h2 style="margin-top:12px">Additional</h2>
  ${ADDONS.map(a=>`<label class="opt" style="margin:0 0 8px;font-weight:400"><span>${a.name} <span class="mut">+${rp(a.price)}</span></span>
  <input type="checkbox" ${draft.adds.includes(a.id)?"checked":""} onchange="togAdd('${a.id}')"></label>`).join("")}
  <label>Catatan (opsional)</label><input type="text" id="dn" value="${draft.note}" placeholder="cth: saus dipisah" oninput="draft.note=this.value">
  <div class="row" style="margin-top:14px"><b>Jumlah</b>
  <div class="qty"><button onclick="dq(-1)">−</button><span>${draft.qty}</span><button onclick="dq(1)">+</button></div></div>
  <button class="cta" ${p.sauces&&!draft.sauce?"disabled":""} onclick="addCart()">${p.sauces&&!draft.sauce?"Pilih sauce dulu":"Tambah ke keranjang · "+rp(lineTotal(draft))}</button>
  <button class="ghost" onclick="hide()">Batal</button>`);
}
function togAdd(id){ const i=draft.adds.indexOf(id); i<0?draft.adds.push(id):draft.adds.splice(i,1); drawPick(); }
function dq(d){ draft.qty=Math.max(1,draft.qty+d); drawPick(); }
function setSauce(i){ draft.sauce=PRODUCTS.find(x=>x.id===draft.pid).sauces[i]; drawPick(); }
function addCart(){ cart.push(draft); draft=null; hide(); refresh(); }
function total(){ return cart.reduce((s,l)=>s+lineTotal(l),0); }
function fee(){ return (form.mode==="Delivery" && deliv.ok) ? deliv.fee : 0; }
function grandTotal(){ return total()+fee(); }
function boxHtml(){
  if(deliv.loading) return '<span class="mut">Menghitung jarak…</span>';
  if(deliv.ok) return `<div class="row"><span>Jarak antar</span><b>${deliv.km.toLocaleString("id-ID")} km</b></div><div class="row"><span>Ongkir</span><b style="color:var(--ok)">${rp(deliv.fee)}</b></div>${deliv.src==="gps"?'<small class="mut">Titik GPS dipakai untuk jarak. Isi alamat lengkap di atas untuk kurir.</small>':(deliv.terbaca?`<small class="mut">Alamat terbaca: ${deliv.terbaca}</small>`:"")}`;
  if(deliv.msg) return `<span style="color:var(--red)">${deliv.msg}</span>`;
  return '<span class="mut">Isi alamat lalu tekan "Hitung dari alamat", atau pakai lokasi saya. Tarif Rp2.500/km, minimal Rp12.500, maks. 10 km.</span>';
}
function updBox(){ const b=$("ongkirBox"); if(b) b.innerHTML=boxHtml(); }
function onAddr(){ if(deliv.src!=="gps") deliv.ok=false; updBox(); }
function useLoc(){
  if(!navigator.geolocation){ deliv.ok=false; deliv.msg="Browser tidak mendukung GPS, isi alamat saja."; return updBox(); }
  deliv.loading=true; deliv.msg=""; deliv.ok=false; updBox();
  navigator.geolocation.getCurrentPosition(
    p=>{ deliv.coords={lat:p.coords.latitude,lng:p.coords.longitude}; calcOngkir("gps"); },
    ()=>{ deliv.loading=false; deliv.ok=false; deliv.msg="Lokasi tidak bisa diakses. Izinkan akses lokasi, atau isi alamat lalu tekan Hitung dari alamat."; updBox(); },
    {enableHighAccuracy:true,timeout:10000});
}
async function calcOngkir(src){
  const ta=$("fa"); if(ta) form.addr=ta.value.trim();
  let body;
  if(src==="gps" && deliv.coords){ body=deliv.coords; deliv.src="gps"; }
  else {
    if(!form.addr){ deliv.ok=false; deliv.msg="Isi alamat dulu."; return updBox(); }
    deliv.coords=null; deliv.src="alamat"; body={alamat:form.addr};
  }
  deliv.loading=true; deliv.msg=""; deliv.ok=false; deliv.terbaca=""; updBox();
  try{
    const r=await fetch("/api/ongkir",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d=await r.json();
    deliv.loading=false;
    if(d.ok){ deliv.ok=true; deliv.km=d.jarak_km; deliv.fee=d.ongkir; deliv.terbaca=d.alamat_terbaca||""; }
    else { deliv.ok=false; deliv.msg=d.pesan||"Gagal menghitung ongkir."; }
  }catch(e){ deliv.loading=false; deliv.ok=false; deliv.msg="Koneksi bermasalah. Coba lagi."; }
  updBox();
}
function refresh(){
  const n = cart.reduce((s,l)=>s+l.qty,0);
  $("bar").style.display = n ? "block" : "none";
  $("bc").textContent = n + " item";
  $("nb").textContent = n;
  $("bt").textContent = rp(total()) + " · Lihat keranjang";
}
function scq(i,d){ cart[i].qty+=d; if(cart[i].qty<1) cart.splice(i,1); refresh(); }
function renderSide(){
  const s = $("side");
  if(!cart.length){ s.innerHTML = `<h3>Keranjang</h3><p class="mut">Belum ada pesanan. Pilih menu di sebelah kiri untuk mulai.</p>`; return; }
  s.innerHTML = `<h3>Keranjang</h3>` + cart.map((l,i)=>{const p=PRODUCTS.find(x=>x.id===l.pid);
    return `<div class="sum"><div class="row"><b>${p.name}</b><span>${rp(lineTotal(l))}</span></div>
    <div class="mut">${l.sauce?"Sauce "+l.sauce+(l.adds.length?" · ":""):""}${l.adds.length?l.adds.map(a=>ADDONS.find(x=>x.id===a).name).join(", "):(l.sauce?"":"Tanpa tambahan")}${l.note?" · "+l.note:""}</div>
    <div class="qty" style="margin-top:8px"><button onclick="scq(${i},-1)">−</button><span>${l.qty}</span><button onclick="scq(${i},1)">+</button></div></div>`}).join("") +
    `<div class="row tot"><span>Total</span><span>${rp(total())}</span></div><button class="cta" onclick="openCheckout()">Lanjut ke checkout</button>`;
}
function steps(n){ return `<div class="steps">${[1,2,3,4].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div>`; }
function cq(i,d){ cart[i].qty+=d; if(cart[i].qty<1) cart.splice(i,1); refresh(); cart.length?openCart():hide(); }

function openCart(){
  if(!cart.length){ show(`<div style="text-align:center;padding:20px 0"><div style="font-size:44px">🛒</div><b style="font-size:18px">Keranjang masih kosong</b><p class="mut">Pilih menu dulu untuk mulai pesan.</p><button class="cta" onclick="hide()">Lihat menu</button></div>`); return; }
  show(`${steps(1)}<b style="font-size:18px">Keranjang</b>
  ${cart.map((l,i)=>{const p=PRODUCTS.find(x=>x.id===l.pid);
    return `<div class="sum"><div class="row"><b>${p.name}</b><span>${rp(lineTotal(l))}</span></div>
    <div class="mut">${l.sauce?"Sauce "+l.sauce+(l.adds.length?" · ":""):""}${l.adds.length?l.adds.map(a=>ADDONS.find(x=>x.id===a).name).join(", "):(l.sauce?"":"Tanpa tambahan")}${l.note?" · "+l.note:""}</div>
    <div class="qty" style="margin-top:8px"><button onclick="cq(${i},-1)">−</button><span>${l.qty}</span><button onclick="cq(${i},1)">+</button></div></div>`}).join("")}
  <div class="row tot"><span>Total</span><span>${rp(total())}</span></div>
  <button class="cta" onclick="openCheckout()">Lanjut ke checkout</button>
  <button class="ghost" onclick="hide()">Tambah menu lain</button>`);
}
function openCheckout(err){
  show(`${steps(2)}<b style="font-size:18px">Checkout</b>
  <label>Nama pemesan</label><input type="text" id="fn" value="${form.name}" placeholder="Nama kamu">
  <label>No. WhatsApp</label><input type="tel" id="fp" value="${form.phone}" placeholder="08xxxxxxxxxx">
  <label>Tanggal pemesanan (ambil / antar)</label><div class="sum" style="margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${form.date?fmtDate(form.date):"Belum dipilih"}</b><button class="add" style="padding:7px 12px" onclick="hide();document.getElementById('week').scrollIntoView({behavior:'smooth',block:'center'})">Ubah</button></div>
  <label>Pengambilan</label>
  <div class="seg"><button class="${form.mode==="Pickup"?"on":""}" onclick="setMode('Pickup')">Ambil sendiri</button><button class="${form.mode==="Delivery"?"on":""}" onclick="setMode('Delivery')">Diantar</button></div>
  ${form.mode==="Delivery"?`<label>Alamat lengkap (jalan, no., kelurahan, gedung/lantai)</label><textarea id="fa" rows="3" placeholder="Alamat lengkap" oninput="onAddr()">${form.addr}</textarea>
  <div class="seg" style="margin-top:8px"><button onclick="useLoc()">📍 Pakai lokasi saya</button><button onclick="calcOngkir('alamat')">Hitung dari alamat</button></div>
  <div class="sum" id="ongkirBox" style="margin-top:8px">${boxHtml()}</div>`:""}
  <label>Catatan pesanan (opsional)</label><input type="text" id="fo" value="${form.note}">
  <div class="err" id="er" style="display:${err?"block":"none"}">${err||""}</div>
  <button class="cta" onclick="toConfirm()">Review pesanan</button>
  <button class="ghost" onclick="openCart()">Kembali</button>`);
}
function readForm(){
  form.name=$("fn").value.trim(); form.phone=$("fp").value.trim();
  form.addr=$("fa")?$("fa").value.trim():form.addr; form.note=$("fo").value.trim();
}
function setMode(m){ readForm(); form.mode=m; openCheckout(); }
function toConfirm(){
  readForm();
  if(!form.name) return openCheckout("Nama wajib diisi");
  if(!/^(\+?62|0)\d{8,13}$/.test(form.phone.replace(/[\s-]/g,""))) return openCheckout("Nomor WhatsApp belum valid");
  if(!form.date) return openCheckout("Tanggal pemesanan wajib dipilih");
  if(form.date<todayStr()) return openCheckout("Tanggal tidak boleh sudah lewat");
  if(isClosed(form.date)) return openCheckout("Tanggal tersebut tutup, pilih tanggal lain");
  if(form.mode==="Delivery" && !form.addr) return openCheckout("Alamat wajib diisi untuk diantar");
  if(form.mode==="Delivery" && !deliv.ok) return openCheckout("Hitung ongkir dulu sebelum lanjut");
  show(`${steps(3)}<b style="font-size:18px">Konfirmasi pesanan</b>
  <div class="sum">${cart.map(l=>{const p=PRODUCTS.find(x=>x.id===l.pid);
    return `<div class="row"><span>${l.qty}× ${p.name}${(l.sauce||l.adds.length)?`<br><small class="mut">${l.sauce?"Sauce "+l.sauce:""}${l.sauce&&l.adds.length?" · ":""}${l.adds.length?"+ "+l.adds.map(a=>ADDONS.find(x=>x.id===a).name).join(", "):""}</small>`:""}</span><span>${rp(lineTotal(l))}</span></div>`}).join("")}
  ${fee()?`<div class="row"><span class="mut">Subtotal</span><span>${rp(total())}</span></div><div class="row"><span class="mut">Ongkir (${deliv.km} km)</span><span>${rp(fee())}</span></div>`:""}<div class="row tot"><span>Total</span><span>${rp(grandTotal())}</span></div></div>
  <div class="sum"><div class="row"><span class="mut">Nama</span><span>${form.name}</span></div>
  <div class="row"><span class="mut">WhatsApp</span><span>${form.phone}</span></div>
  <div class="row"><span class="mut">Tanggal</span><span style="text-align:right">${fmtDate(form.date)}</span></div>
  <div class="row"><span class="mut">Pengambilan</span><span>${form.mode==="Pickup"?"Ambil sendiri":"Diantar"}</span></div>
  ${form.mode==="Delivery"?`<div class="row"><span class="mut">Alamat</span><span style="text-align:right">${form.addr}</span></div>`:""}</div>
  <p class="mut">Langkah berikutnya: bayar via QRIS, lalu konfirmasi ke WhatsApp.</p>
  <button class="cta" onclick="showPay()">Lanjut ke pembayaran</button>
  <button class="ghost" onclick="openCheckout()">Ubah data</button>`);
}
function showPay(){
  show(`${steps(4)}<b style="font-size:18px">Pembayaran QRIS</b>
  <div class="row" style="margin-top:8px"><span class="mut">Total yang harus dibayar</span><b style="font-size:20px;color:var(--red)">${rp(grandTotal())}</b></div>
  <img class="qris" src="${QRIS}" alt="QRIS Uncle Lu Ricebowls">
  <p class="mut">Scan QRIS di atas lewat m-banking atau e-wallet, masukkan nominal sesuai total. Di HP, tahan gambar untuk menyimpannya.</p>
  <label class="opt" style="font-weight:400"><span>Saya sudah melakukan pembayaran</span><input type="checkbox" id="paid" onchange="$('wab').disabled=!this.checked"></label>
  <button class="cta wa" id="wab" disabled onclick="sendWA()">Konfirmasi via WhatsApp</button>
  <p class="mut" style="text-align:center">Kirim pesan yang terisi otomatis, lalu lampirkan bukti transfer di chat.</p>
  <button class="ghost" onclick="toConfirm()">Kembali</button>`);
}
function sendWA(){
  let t = "Halo Uncle Lu, saya sudah membayar via QRIS dan ingin konfirmasi order.\n\n";
  t += `Nama: ${form.name}\nNo. HP: ${form.phone}\nTanggal pemesanan: ${fmtDate(form.date)}\nPengambilan: ${form.mode==="Pickup"?"Ambil sendiri":"Diantar"}\n`;
  if(form.mode==="Delivery") t += `Alamat: ${form.addr}\n`;
  if(form.mode==="Delivery" && deliv.coords) t += `Titik lokasi: https://maps.google.com/?q=${deliv.coords.lat},${deliv.coords.lng}\n`;
  t += "\nPesanan:\n";
  cart.forEach((l,i)=>{
    const p = PRODUCTS.find(x=>x.id===l.pid);
    t += `${i+1}. ${p.name} x${l.qty}`;
    if(l.sauce) t += ` (Sauce ${l.sauce})`;
    if(l.adds.length) t += ` (+ ${l.adds.map(a=>ADDONS.find(x=>x.id===a).name).join(", ")})`;
    if(l.note) t += ` [${l.note}]`;
    t += ` = ${rp(lineTotal(l))}\n`;
  });
  if(fee()) t += `\nSubtotal: ${rp(total())}\nOngkir (${deliv.km} km): ${rp(fee())}`;
  t += `\nTotal dibayar: ${rp(grandTotal())}`;
  if(form.note) t += `\nCatatan: ${form.note}`;
  t += "\n\n(Bukti pembayaran saya lampirkan di chat ini)";
  saveOrder();
  window.open("https://wa.me/"+(typeof WA_NUMBER!=="undefined"?WA_NUMBER:"6287778203066")+"?text="+encodeURIComponent(t), "_blank");
  cart = []; refresh();
  deliv = {ok:false,fee:0,km:0,loading:false,msg:"",coords:null,src:"",terbaca:""};
  show(`<div style="text-align:center;padding:20px 0"><div style="font-size:48px">✅</div><b style="font-size:18px">Pesanan diteruskan ke WhatsApp</b>
  <p class="mut">Kirim pesan yang sudah terisi, lampirkan bukti bayar, lalu tunggu konfirmasi dari admin.</p>
  <button class="cta" onclick="hide()">Kembali ke menu</button></div>`);
}
const DAY=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const DAYS3=["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
const MON=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
let weekOff=0;
let TUTUP_DB=[]; let TUTUP_DOW=[]; let TUTUP_NOTE={};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function isClosed(s){ const d=new Date(s+"T00:00:00"); const ht=typeof HARI_TUTUP!=="undefined"?HARI_TUTUP:[], tt=typeof TANGGAL_TUTUP!=="undefined"?TANGGAL_TUTUP:[]; return ht.includes(DAY[d.getDay()]) || tt.includes(s) || TUTUP_DB.includes(s) || TUTUP_DOW.includes(d.getDay()); }
function weekStart(off){ const t=new Date(); t.setHours(0,0,0,0); t.setDate(t.getDate()-((t.getDay()+6)%7)+off*7); return t; }
function renderWeek(){
  const st=weekStart(weekOff), today=todayStr(), days=[];
  for(let i=0;i<7;i++){ const d=new Date(st); d.setDate(st.getDate()+i); days.push(d); }
  const a=days[0], b=days[6];
  const label=`${a.getDate()} ${MON[a.getMonth()]} – ${b.getDate()} ${MON[b.getMonth()]} ${b.getFullYear()}`;
  $("week").innerHTML=`<div class="wk-head"><button class="wk-nav" ${weekOff<=0?"disabled":""} onclick="moveWeek(-1)">‹</button><b>${label}</b><button class="wk-nav" ${weekOff>=3?"disabled":""} onclick="moveWeek(1)">›</button></div>
  <div class="wk-days">${days.map(d=>{const s=ymd(d),past=s<today,cl=isClosed(s),on=form.date===s,dis=past||cl;
    return `<button class="wk-d ${on?"on":""} ${dis?"off":""} ${cl&&!past?"cl":""}" ${dis?"disabled":""} ${cl&&!past&&TUTUP_NOTE[s]?`title="${String(TUTUP_NOTE[s]).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}"`:""} onclick="setDate('${s}')"><small>${DAYS3[d.getDay()]}</small><b>${d.getDate()}</b><em>${past?"":cl?"Tutup":"Buka"}</em></button>`}).join("")}</div>
  <p class="mut" style="margin:8px 0 0">${form.date?"Pesanan untuk: <b>"+fmtDate(form.date)+"</b>":"Pilih tanggal pesanan dulu"}</p>`;
}
function setDate(s){ form.date=s; renderWeek(); }
function moveWeek(n){ weekOff+=n; renderWeek(); }
refresh();
renderWeek();
const sbOn=()=>typeof SUPABASE_URL!=="undefined" && SUPABASE_URL && SUPABASE_KEY;
const sbHead=()=>({apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY});
async function loadClosed(){
  if(!sbOn()) return;
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/closed_dates?select=tanggal,catatan&tanggal=gte.${todayStr()}`,{headers:sbHead()});
    if(!r.ok) return;
    const rows=await r.json();
    TUTUP_DB=rows.map(x=>x.tanggal);
    TUTUP_NOTE=Object.fromEntries(rows.map(x=>[x.tanggal,x.catatan||""]));
    try{const w=await fetch(`${SUPABASE_URL}/rest/v1/closed_weekdays?select=dow`,{headers:sbHead()});
      if(w.ok) TUTUP_DOW=(await w.json()).map(x=>Number(x.dow));}catch(e){}
    if(form.date && isClosed(form.date)) form.date="";
    renderWeek();
  }catch(e){}
}
function saveOrder(){
  if(!sbOn()) return;
  const items=cart.map(l=>{const p=PRODUCTS.find(x=>x.id===l.pid);return {menu:p.name,qty:l.qty,sauce:l.sauce||null,tambahan:l.adds.map(a=>ADDONS.find(x=>x.id===a).name),catatan:l.note||null,subtotal:lineTotal(l)};});
  const body={nama:form.name,phone:form.phone,tanggal:form.date,pengambilan:form.mode==="Pickup"?"Ambil sendiri":"Diantar",alamat:form.mode==="Delivery"?form.addr:null,lat:deliv.coords?deliv.coords.lat:null,lng:deliv.coords?deliv.coords.lng:null,catatan:form.note||null,items,subtotal:total(),ongkir:fee(),total:grandTotal()};
  fetch(`${SUPABASE_URL}/rest/v1/web_orders`,{method:"POST",keepalive:true,headers:{...sbHead(),"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(body)}).catch(()=>{});
}
loadClosed();
// Segarkan hari tutup tiap 60 detik dan saat tab aktif kembali
setInterval(loadClosed,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadClosed();});
</script>
</body>
</html>
