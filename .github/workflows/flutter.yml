name: Flutter check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Siapkan proyek
        run: |
          flutter create . --org id.satupintu --platforms=android,ios --project-name satu_pintu
          rm -f test/widget_test.dart
          flutter pub get
          flutter gen-l10n
      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos > analyze.txt 2>&1 || status=$?
          grep -E "error •|warning •" analyze.txt > issues.txt || true
          { echo '```'; cat issues.txt; tail -n 1 analyze.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat issues.txt
          exit ${status:-0}
      - run: flutter test
