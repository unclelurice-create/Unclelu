name: Build APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Siapkan proyek
        run: |
          flutter create . --org id.satupintu --platforms=android --project-name satu_pintu
          rm -f test/widget_test.dart
          flutter pub get
          flutter gen-l10n
          if [ -d android_icons/res ]; then cp -r android_icons/res/* android/app/src/main/res/; fi
          sed -i 's/android:label="[^"]*"/android:label="Satu Pintu"/' android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          f=android/build.gradle.kts; [ -f "$f" ] || f=android/build.gradle
          printf '\nsubprojects {\n    tasks.matching { it.name.contains("lint") }.configureEach { enabled = false }\n}\n' >> "$f"
      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL=https://rjsrnjgivjsxqjlkgjqp.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_18vDmtyNXMiFFcie1DOSxw_YoBBUgTg
      - uses: actions/upload-artifact@v4
        with:
          name: satu-pintu-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
